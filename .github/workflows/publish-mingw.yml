name: Publish skiko (mingwX64)

# Route 1a: builds the Kotlin/Native Windows (mingwX64) skiko artifacts on a
# Windows runner and publishes them (klib + the runtime skiko-windows-x64.dll)
# to this repo's GitHub Packages Maven registry, under the fork's rebranded
# coordinates com.bitsycore.skiko:skiko / :skiko-mingwx64 (the group is set by
# DEFAULT_GROUP_ID in skiko/buildSrc/src/main/kotlin/properties.kt; only the
# Maven coord is rebranded — the org.jetbrains.skiko.* package names stay).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Maven version to publish"
        required: true
        default: "0.150.1-mingw.1"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Put LLVM on PATH (clang-cl / lld-link / llvm-dlltool)
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin"

      - name: Locate Visual Studio Build Tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Write-Host "VS Build Tools: $vs"
          Add-Content -Path $env:GITHUB_ENV -Value "SKIKO_VSBT_PATH=$vs"

      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-v1

      - name: Cache Skia binaries
        uses: actions/cache@v4
        with:
          path: dependencies
          key: skia-${{ runner.os }}-m150

      - name: Publish to GitHub Packages and maven.bitsycore.com
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BITSYCORE_MAVEN_USER: ${{ secrets.BITSYCORE_MAVEN_USER }}
          BITSYCORE_MAVEN_TOKEN: ${{ secrets.BITSYCORE_MAVEN_TOKEN }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            --init-script .github/gh-packages.init.gradle.kts \
            :skiko:publishMingwX64PublicationToGitHubPackagesRepository \
            :skiko:publishKotlinMultiplatformPublicationToGitHubPackagesRepository \
            :skiko:publishMingwX64PublicationToBitsycoreRepository \
            :skiko:publishKotlinMultiplatformPublicationToBitsycoreRepository \
            -Pskiko.native.windows.enabled=true \
            -Pdeploy.version="${{ github.event.inputs.version }}" \
            -Pdeploy.release=true \
            -PgithubPackagesUrl="https://maven.pkg.github.com/${{ github.repository }}"
